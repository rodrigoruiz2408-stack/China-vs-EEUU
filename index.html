<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Guerra Comercial Tycoon 3D</title><style>body{margin:0;overflow:hidden;font-family:sans-serif;background:#05070f;user-select:none;}#sc-i{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle,#1e293b,#0f172a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff;}#ui{position:fixed;top:20px;left:20px;z-index:100;pointer-events:none;}#card{background:rgba(10,15,30,0.85);border-left:6px solid #3b82f6;padding:15px;border-radius:10px;color:#fff;box-shadow:0 10px 25px rgba(0,0,0,0.5);backdrop-filter:blur(5px);min-width:250px;}#m-disp{font-size:2.2rem;font-weight:900;color:#22c55e;}#n-disp{font-size:0.85rem;color:#94a3b8;margin-top:5px;border-top:1px solid rgba(255,255,255,0.1);padding-top:5px;}.b-cnt{display:flex;gap:20px;margin-top:20px;}.btn{padding:15px 25px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;color:#fff;font-size:1rem;}.b-usa{background:#ef4444;}.b-chi{background:#eab308;color:#0f172a;}#ctrls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#cbd5e1;background:rgba(10,15,30,0.8);padding:8px 20px;border-radius:20px;font-size:0.8rem;z-index:100;text-align:center;}canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}</style><script src="https://cloudflare.com"></script></head><body><div id="sc-i"><h1>GUERRA COMERCIAL TYCOON 3D 🚢</h1><p>Elige tu superpotencia para iniciar</p><div class="b-cnt"><button class="btn b-usa" onclick="start('usa')">🇺🇸 EE.UU.</button><button class="btn b-chi" onclick="start('china')">🇨🇳 China</button></div></div><div id="ui"><div id="card"><div id="m-disp">\$100</div><div id="n-disp">Cargando...</div></div></div><div id="ctrls">WASD/Flechas: Mover personaje | Mantener Clic Izquierdo y arrastrar: Girar Cámara Orbital</div><canvas id="cnv"></canvas><script>let bd='',mon='\$',cash=100,cost=50,nFab=0,sc,cam,ren,jug,fl,gd,tc={},mP=0,mx=0,my=0,aH=Math.PI/4,aV=Math.PI/4,rad=18;const lU=["Oficina Código","Servidor LED","Planta Chips","Matriz IA"],lC=["Taller Shenzhen","Planta Baterías","Línea Autos EV","Red Minerales"];let pFb={x:-6,z:-3,r:1.5,c:0x22c55e,m:null},pEx={x:6,z:5,r:1.5,c:0xf97316,m:null};function start(s){bd=s;mon=bd==='usa'?'\$':'¥';document.getElementById('sc-i').style.display='none';document.getElementById('borde').id='card';document.getElementById('card').style.borderLeftColor=bd==='usa'?'#3b82f6':'#eab308';setup();up();setInterval(()=>{if(nFab>0){cash+=nFab*15;up();}},1500);loop();}function setup(){sc=new THREE.Scene();sc.background=new THREE.Color(bd==='usa'?0x0a0f1d:0x1a0a02);sc.fog=new THREE.FogExp2(sc.background,0.02);cam=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);ren=new THREE.WebGLRenderer({canvas:document.getElementById('cnv'),antialias:true});ren.setSize(window.innerWidth,window.innerHeight);ren.shadowMap.enabled=true;sc.add(new THREE.AmbientLight(0xffffff,0.6));let sol=new THREE.DirectionalLight(0xffffff,1.0);sol.position.set(10,20,10);sol.castShadow=true;sc.add(sol);fl=new THREE.Mesh(new THREE.BoxGeometry(40,0.4,40),new THREE.MeshStandardMaterial({color:0x1e293b,roughness:0.6}));fl.position.y=-0.2;fl.receiveShadow=true;sc.add(fl);gd=new THREE.GridHelper(40,20,bd==='usa'?0x00f0ff:0xeab308,0x334155);sc.add(gd);jug=new THREE.Mesh(new THREE.BoxGeometry(1.2,2.0,1.2),new THREE.MeshStandardMaterial({color:bd==='usa'?0x3b82f6:0xeab308}));jug.position.set(0,1,3);jug.castShadow=true;sc.add(jug);[pFb,pEx].forEach(p=>{let m=new THREE.Mesh(new THREE.CylinderGeometry(p.r,p.r,0.15,32),new THREE.MeshStandardMaterial({color:p.c,emissive:p.c,emissiveIntensity:0.4}));m.position.set(p.x,0.08,p.z);m.receiveShadow=true;sc.add(m);p.m=m;});window.addEventListener('mousedown',e=>{mP=1;mx=e.clientX;my=e.clientY;});window.addEventListener('mouseup',()=>mP=0);window.addEventListener('mousemove',e=>{if(mP){aH-=(e.clientX-mx)*0.007;aV=Math.max(0.2,Math.min(Math.PI/2.1,aV+(e.clientY-my)*0.007));mx=e.clientX;my=e.clientY;}});window.addEventListener('keydown',e=>tc[e.key.toLowerCase()]=1);window.addEventListener('keyup',e=>tc[e.key.toLowerCase()]=0);}function up(){let l=bd==='usa'?lU:lC;let txt=nFab<l.length?`Siguiente: ${l[nFab]} (${mon}${cost})`:"¡Imperio Máximo! 🏆";document.getElementById('m-disp').innerText=`${mon}${cash}`;document.getElementById('n-disp').innerText=txt;}function buy(){let l=bd==='usa'?lU:lC;if(cash>=cost&&nFab<l.length){cash-=cost;let h=4+Math.random()*4;let m=new THREE.Mesh(new THREE.BoxGeometry(3,h,3),new THREE.MeshStandardMaterial({color:bd==='usa'?0x1d4ed8:0xb45309,roughness:0.2}));m.position.set(-14+(nFab*7),h/2,-10);m.castShadow=true;sc.add(m);nFab++;cost=Math.round(cost*2.8);jug.position.z+=1.5;up();}}function loop(){requestAnimationFrame(loop);let v=0.18;if(tc['w']||tc['arrowup'])jug.position.z-=v;if(tc['s']||tc['arrowdown'])jug.position.z+=v;if(tc['a']||tc['arrowleft'])jug.position.x-=v;if(tc['d']||tc['arrowright'])jug.position.x+=v;jug.position.x=Math.max(-19,Math.min(19,jug.position.x));jug.position.z=Math.max(-19,Math.min(19,jug.position.z));cam.position.x=jug.position.x+rad*Math.sin(aH)*Math.cos(aV);cam.position.z=jug.position.z+rad*Math.cos(aH)*Math.cos(aV);cam.position.y=jug.position.y+rad*Math.sin(aV);cam.lookAt(jug.position);if(pFb.m)pFb.m.rotation.y+=0.02;if(pEx.m)pEx.m.rotation.y+=0.02;if(jug.position.distanceTo(new THREE.Vector3(pFb.x,jug.position.y,pFb.z))<1.6)buy();if(jug.position.distanceTo(new THREE.Vector3(pEx.x,jug.position.y,pEx.z))<1.6&&cash>=100){cash-=100;rad=Math.min(30,rad+4);fl.scale.addScalar(0.25);gd.scale.addScalar(0.25);jug.position.z-=2;up();}ren.render(sc,cam);}window.addEventListener('resize',()=>{cam.aspect=window.innerWidth/window.innerHeight;cam.updateProjectionMatrix();ren.setSize(window.innerWidth,window.innerHeight);});</script></body></html>
