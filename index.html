<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerra Comercial Tycoon 3D - Corregido</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0f172a; user-select: none; }
        
        /* Controles de la interfaz por encima del juego sin bloquear clics */
        #interfaz { position: fixed; top: 20px; left: 20px; z-index: 100; pointer-events: none; }
        .bloque-ui { background: rgba(15, 23, 42, 0.85); padding: 15px 20px; border-radius: 12px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: auto; margin-bottom: 10px; border-left: 5px solid #3b82f6; }
        
        .selector-bando { display: flex; gap: 10px; pointer-events: auto; }
        .btn-bando { padding: 10px 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; font-size: 0.9rem; }
        .btn-usa { background: #ef4444; }
        .btn-china { background: #eab308; color: #1e293b; }
        
        #hud-dinero { font-size: 1.8rem; font-weight: bold; color: #4ade80; margin-bottom: 5px; }
        #hud-info { font-size: 0.9rem; color: #cbd5e1; }
        
        #alerta { position: fixed; top: 20px; right: 20px; background: #ef4444; color: white; padding: 15px 25px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; display: none; z-index: 100; animation: parpadeo 1s infinite; max-width: 320px; box-shadow: 0 4px 15px rgba(239,68,68,0.5); pointer-events: none; }
        #instrucciones { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px; font-size: 0.9rem; z-index: 100; pointer-events: none; }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
    <!-- Motor gráfico 3D oficial -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="interfaz">
        <div class="bloque-ui" id="borde-bando">
            <div id="hud-dinero">Billetera: $100</div>
            <div id="hud-info">Bando: EE.UU. | Fábricas: 0 (Siguiente: $50)</div>
        </div>
        <div class="selector-bando">
            <button class="btn-bando btn-usa" onclick="cambiarBando('usa')">🇺🇸 Cambiar a EE.UU.</button>
            <button class="btn-bando btn-china" onclick="cambiarBando('china')">🇨🇳 Cambiar a China</button>
        </div>
    </div>

    <div id="alerta">🚨 ¡ALERTA ECONÓMICA!</div>
    <div id="instrucciones">Haz clic en el juego. Muévete con FLECHAS o WASD. ¡Pisa el cilindro verde para comprar!</div>

    <script>
        let bando = 'usa';
        let dinero = 100;
        let multiplicador = 1;
        let costeFabrica = 50;
        let fabricasCompradas = 0;
        let moneda = '$';

        // 1. Inicialización de la Escena 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a); // Fondo oscuro tecnológico inicial
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Iluminación
        const light = new THREE.DirectionalLight(0xffffff, 1.3);
        light.position.set(10, 20, 15);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x64748b, 0.5));

        // Suelo gris del mundo
        const floorGeo = new THREE.BoxGeometry(40, 0.5, 40);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -0.25;
        scene.add(floor);

        // Personaje principal estilo cubo de Roblox
        const playerGeo = new THREE.BoxGeometry(1.2, 2, 1.2);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 }); // Azul inicial para USA
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 1, 0);
        scene.add(player);

        // Botón físico en el suelo para pisar y comprar
        const btnGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.2, 32);
        const btnMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x15803d, emissiveIntensity: 0.4 });
        const botonCompra = new THREE.Mesh(btnGeo, btnMat);
        botonCompra.position.set(0, 0.1, -5);
        scene.add(botonCompra);

        // Cámara aérea isométrica inclinada hacia el jugador
        camera.position.set(0, 12, 12);
        camera.lookAt(player.position);

        // Teclado listo para detectar movimientos
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        window.addEventListener('keydown', e => { if(e.key in keys) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if(e.key in keys) keys[e.key] = false; });

        // 2. Lógica de Intercambio de Bandos (USA / CHINA)
        function cambiarBando(seleccion) {
            bando = seleccion;
            moneda = bando === 'usa' ? '$' : '¥';
            
            // Actualizaciones visuales inmediatas
            if (bando === 'usa') {
                player.material.color.setHex(0x3b82f6); // Azul
                scene.background.setHex(0x0f172a); // Fondo oscuro frío
                document.getElementById('borde-bando').style.borderLeftColor = '#3b82f6';
            } else {
                player.material.color.setHex(0xeab308); // Amarillo
                scene.background.setHex(0x451a03); // Fondo cálido industrial
                document.getElementById('borde-bando').style.borderLeftColor = '#eab308';
            }
            actualizarHUD();
        }

        function actualizarHUD() {
            let nombreBando = bando === 'usa' ? 'EE.UU.' : 'China';
            document.getElementById('hud-dinero').innerText = `Billetera: ${moneda}${dinero}`;
            document.getElementById('hud-info').innerText = `Bando: ${nombreBando} | Fábricas: ${fabricasCompradas} (Siguiente: ${moneda}${costeFabrica})`;
        }

        // 3. Generación Automatizada de Dinero Pasivo
        setInterval(() => {
            if (fabricasCompradas > 0) {
                let gananciaBase = fabricasCompradas * 5;
                dinero += Math.round(gananciaBase * multiplicador);
                actualizarHUD();
            }
        }, 1500);

        // 4. Bucle Aleatorio de Eventos de Impuestos/Aranceles
        setInterval(() => {
            let azar = Math.random();
            const alertaDiv = document.getElementById('alerta');
            if (azar < 0.5) {
                multiplicador = 0.5; // Reduce ganancias a la mitad
                alertaDiv.innerText = bando === 'usa' ? "🚨 ¡Aranceles de China! Ingresos reducidos al 50%" : "🚨 ¡EE.UU. bloquea puertos! Ingresos al 50%";
                alertaDiv.style.display = 'block';
            } else {
                multiplicador = 1; // Normalizar economía
                alertaDiv.style.display = 'none';
            }
        }, 10000);

        // 5. Mecánica de Construcción Física 3D al Pisar
        function construirFabrica() {
            fabricasCompradas++;
            dinero -= costeFabrica;
            costeFabrica = Math.round(costeFabrica * 1.6); // Escalar precios al estilo Roblox Tycoon
            
            // Diseñar bloque del edificio en 3D
            const fabGeo = new THREE.BoxGeometry(2, 3 + Math.random()*4, 2);
            const fabMat = new THREE.MeshStandardMaterial({ 
                color: bando === 'usa' ? 0x60a5fa : 0xfca5a5,
                roughness: 0.4
            });
            const edif = new THREE.Mesh(fabGeo, fabMat);
            
            // Posicionar el edificio aleatoriamente en la zona superior del mapa
            edif.position.set((Math.random() - 0.5) * 30, fabGeo.parameters.height / 2, (Math.random() - 0.5) * 20 - 8);
            scene.add(edif);
            
            actualizarHUD();
        }

        // 6. Ciclo de Animación Principal (60 FPS)
        function animate() {
            requestAnimationFrame(animate);
            
            // Procesamiento de Físicas de Movimiento
            let velocidad = 0.22;
            if (keys.w || keys.ArrowUp) player.position.z -= velocidad;
            if (keys.s || keys.ArrowDown) player.position.z += velocidad;
            if (keys.a || keys.ArrowLeft) player.position.x -= velocidad;
            if (keys.d || keys.ArrowRight) player.position.x += velocidad;

            // Paredes invisibles del mapa (Evita que el jugador caiga al vacío)
            player.position.x = Math.max(-19, Math.min(19, player.position.x));
            player.position.z = Math.max(-19, Math.min(19, player.position.z));

            // Cámara sigue de manera fluida al jugador
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 12;

            // Animación del botón rotatorio
            botonCompra.rotation.y += 0.02;

            // Detección matemática de pisada (Colisión con el círculo verde)
            let distancia = player.position.distanceTo(botonCompra.position);
            if (distancia < 1.7 && dinero >= costeFabrica) {
                construirFabrica();
                player.position.z += 1.8; // Empuja levemente al jugador atrás para evitar compras infinitas por accidente
            }

            renderer.render(scene, camera);
        }
        animate();

        // Reajustar dimensiones si el usuario cambia el tamaño de la pestaña
