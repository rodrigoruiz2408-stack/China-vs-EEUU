<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerra Comercial Tycoon</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background: #0f172a; user-select: none; }
        #ui { position: fixed; top: 20px; left: 20px; z-index: 10; }
        .box { background: rgba(15,23,42,0.9); padding: 15px; border-radius: 10px; color: white; margin-bottom: 10px; border-left: 5px solid #3b82f6; }
        .btn { padding: 10px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; color: white; margin-right: 5px; }
        #hud-m { font-size: 1.8rem; font-weight: bold; color: #4ade80; }
        #alerta { position: fixed; top: 20px; right: 20px; background: #ef4444; color: white; padding: 15px; border-radius: 8px; font-weight: bold; display: none; z-index: 10; }
        #inst { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px; font-size: 0.85rem; text-align: center; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="box" id="borde">
            <div id="hud-m">Billetera: \$100</div>
            <div id="hud-i">Bando: EE.UU. | Fábricas: 0 (Siguiente: \$50)</div>
        </div>
        <button class="btn" style="background:#ef4444" onclick="bando('usa')">🇺🇸 EE.UU.</button>
        <button class="btn" style="background:#eab308;color:#000" onclick="bando('china')">🇨🇳 China</button>
    </div>
    <div id="alerta">🚨 ¡ALERTA ECONÓMICA!</div>
    <div id="inst">Usa WASD / Flechas para moverte, o haz CLIC en el mapa para teletransportarte. ¡Pisa el botón verde!</div>
    <canvas id="cv"></canvas>
    <script>
        const cv = document.getElementById('cv'), cx = cv.getContext('2d');
        function res() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
        window.addEventListener('resize', res); res();
        let bd = 'usa', mon = '\$', cash = 100, mult = 1, cost = 50, fabs = [];
        let p = { x: 0, y: 100, r: 18, c: '#3b82f6', v: 6 }, btn = { x: 0, y: -80, r: 35 };
        const k = {};
        window.addEventListener('keydown', e => k[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => k[e.key.toLowerCase()] = false);
        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'BUTTON') {
                p.x = e.clientX - cv.width / 2;
                p.y = e.clientY - cv.height / 2;
            }
        });
        function bando(s) {
            bd = s; mon = bd === 'usa' ? '\$' : '¥';
            p.c = bd === 'usa' ? '#3b82f6' : '#eab308';
            document.getElementById('borde').style.borderLeftColor = p.c;
            up();
        }
        function up() {
            document.getElementById('hud-m').innerText = `Billetera: ${mon}${cash}`;
            document.getElementById('hud-i').innerText = `Bando: ${bd.toUpperCase()} | Fábricas: ${fabs.length} (Siguiente: ${mon}${cost})`;
        }
        setInterval(() => { if (fabs.length > 0) { cash += Math.round(fabs.length * 5 * mult); up(); } }, 1500);
        setInterval(() => {
            let az = Math.random(), div = document.getElementById('alerta');
            if (az < 0.5) {
                mult = 0.5;
                div.innerText = bd === 'usa' ? "🚨 ¡Aranceles de China! Ganancias al 50%" : "🚨 ¡Bloqueo de EE.UU.! Ganancias al 50%";
                div.style.display = 'block';
            } else { mult = 1; div.style.display = 'none'; }
        }, 10000);
        function loop() {
            cx.fillStyle = bd === 'usa' ? '#0f172a' : '#451a03'; cx.fillRect(0, 0, cv.width, cv.height);
            cx.save(); cx.translate(cv.width / 2, cv.height / 2);
            cx.fillStyle = '#334155'; cx.fillRect(-cv.width * 0.4, -cv.height * 0.4, cv.width * 0.8, cv.height * 0.8);
            cx.beginPath(); cx.arc(btn.x, btn.y, btn.r, 0, Math.PI * 2); cx.fillStyle = '#22c55e'; cx.fill();
            cx.fillStyle = '#fff'; cx.font = 'bold 10px sans-serif'; cx.textAlign = 'center'; cx.fillText("COMPRAR", btn.x, btn.y + 4);
            fabs.forEach(f => {
                cx.fillStyle = 'rgba(0,0,0,0.2)'; cx.fillRect(f.x - 12, f.y - f.h + 5, 25, f.h);
                cx.fillStyle = f.c; cx.fillRect(f.x - 12, f.y - f.h, 25, f.h);
                cx.fillStyle = '#fff'; cx.fillRect(f.x - 12, f.y - f.h, 25, 5);
            });
            cx.fillStyle = p.c; cx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
            cx.fillStyle = '#fff'; cx.fillRect(p.x - 9, p.y - 5, 5, 5); cx.fillRect(p.x + 4, p.y - 5, 5, 5);
            cx.restore();
            if (k['arrowup'] || k['w']) p.y -= p.v; if (k['arrowdown'] || k['s']) p.y += p.v;
            if (k['arrowleft'] || k['a']) p.x -= p.v; if (k['arrowright'] || k['d']) p.x += p.v;
            p.x = Math.max(-cv.width * 0.38, Math.min(cv.width * 0.38, p.x));
            p.y = Math.max(-cv.height * 0.38, Math.min(cv.height * 0.38, p.y));
            if (Math.sqrt((p.x - btn.x)**2 + (p.y - btn.y)**2) < p.r + btn.r && cash >= cost) {
                cash -= cost; fabs.push({ x: (Math.random() - 0.5) * (cv.width * 0.5), y: ((Math.random() - 0.5) * (cv.height * 0.3)) - 100, h: 40 + Math.random() * 40, c: bd === 'usa' ? '#60a5fa' : '#fca5a5' });
                cost = Math.round(cost * 1.6); p.y += 45; up();
            }
            requestAnimationFrame(loop);
        }
        up(); requestAnimationFrame(loop);
    </script>
</body>
</html>
