<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiz: Guerra Comercial</title><style>body{margin:0;padding:20px;font-family:sans-serif;background:#0f172a;color:#f8fafc;display:flex;flex-direction:column;align-items:center;min-height:100vh;} .cnt{max-width:600px;width:100%;background:#1e293b;padding:20px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.5);border-top:6px solid #3b82f6;margin-top:20px;}h1{text-align:center;color:#38bdf8;font-size:1.8rem;margin-top:0;}.hud{display:flex;justify-content:between;background:#0f172a;padding:8px 15px;border-radius:6px;margin-bottom:15px;color:#4ade80;font-weight:bold;font-size:0.9rem;border:1px solid #334155;}.q-box{font-size:1.1rem;font-weight:600;margin-bottom:15px;line-height:1.4;}.opt-list{display:flex;flex-direction:column;gap:10px;}.opt-btn{background:#334155;color:#f8fafc;border:2px solid #475569;padding:12px;border-radius:6px;cursor:pointer;text-align:left;font-size:0.95rem;transition:0.2s;}.opt-btn:hover{background:#475569;border-color:#38bdf8;}.fb-box{margin-top:15px;padding:12px;border-radius:6px;display:none;text-align:center;font-weight:bold;}.c-box{background:rgba(34,197,94,0.2);border:2px solid #22c55e;color:#4ade80;}.i-box{background:rgba(239,68,68,0.2);border:2px solid #ef4444;color:#fca5a5;}.nxt-btn{display:none;width:100%;background:#2563eb;color:#fff;border:none;padding:12px;border-radius:6px;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:15px;}</style></head><body><div class="cnt"><h1>TRIVIA: GUERRA COMERCIAL 🇺🇸🇨🇳</h1><div class="hud"><span id="p-txt">Pregunta: 1/5</span><span id="pts-txt" style="margin-left:auto">Puntos: 0</span></div><div id="g-zone"><div class="q-box" id="q-div">Cargando...</div><div class="opt-list" id="opts-div"></div><div class="fb-box" id="fb-div"></div><button class="nxt-btn" id="nxt-b" onclick="nxt()">Siguiente Pregunta ➡️</button></div></div><script>
const qs=[
    {q:"En 2018, Donald Trump desató una lluvia de impuestos a productos chinos. Desde la economía, ¿cuál era el objetivo oficial?",o:[
        {t:"Reducir el déficit comercial de EE.UU. y proteger la industria nacional.",c:1,m:"¡CORRECTO! 🇺🇸 'The Art of the Deal' protegiendo el mercado local."},
        {t:"Que China pagara obligatoriamente la suscripción mensual de Truth Social.",c:0,m:"💥 WRONG! Los aranceles los pagan las empresas importadoras de EE.UU., no Pekín."},
        {t:"Prohibir por ley los rollitos primavera en los pasillos de la Casa Blanca.",c:0,m:"❌ ¡FALSO! La comida asiática sobrevivió invicta, los mercados no tanto."}
    ]},
    {q:"Cuando EE.UU. vetó a Huawei prohibiéndole usar los servicios de Google y Android, ¿cuál fue la justificación de seguridad?",o:[
        {t:"Evitar que los celulares explotaran al escribir el eslogan de Trump.",c:0,m:"❌ ¡INCORRECTO! Las baterías no reaccionan a ideologías políticas."},
        {t:"El riesgo de ciberespionaje y el control monopólico de las futuras redes 5G.",c:1,m:"¡CORRECTO! 📡 El miedo era que Pekín controlara el internet del futuro."},
        {t:"Que venían con un karaoke oculto que grababa tus cantos en la ducha.",c:0,m:"🎵 ¡FALSO! Aunque Xi Jinping juzgando tus notas altas sería un buen meme."}
    ]},
    {q:"El drama político para intentar prohibir o forzar la venta de TikTok en EE.UU. ha durado años. ¿Cuál es el argumento central?",o:[
        {t:"Que los bailes virales y los videos de gatitos devalúan el valor del dólar.",c:0,m:"🐱 ¡FALSO! El feed es adictivo, pero Wall Street se mueve por cosas más serias."},
        {t:"El almacenamiento masivo de datos de usuarios de EE.UU. en servidores de ByteDance.",c:1,m:"¡CORRECTO! 📱 El dilema es la privacidad de la información nacional."},
        {t:"Que el algoritmo te hipnotiza para comprar té verde a las 3 de la mañana.",c:0,m:"🍵 ¡WRONG! El consumo nocturno de té no es una amenaza geopolítica de estado."}
    ]},
    {q:"Cuando China amenazó con restringir la exportación de 'tierras raras', ¿por qué asustó tanto a las industrias de Occidente?",o:[
        {t:"Porque son insumos críticos para fabricar imanes, misiles y chips avanzados.",c:1,m:"¡CORRECTO! 💎 Sin estos 17 elementos químicos esenciales, Silicon Valley se conglera."},
        {t:"Porque se usan para fabricar los espectaculares injertos de cabello de Donald Trump.",c:0,m:"💇‍♂️ ¡FALSO! Esa cabellera es un misterio de la física, no de la minería industrial."},
        {t:"Porque sirven para otorgar superpoderes cuánticos a los pandas del zoológico.",c:0,m:"🐼 ¡INCORRECTO! Los osos pandas ya son perfectos y fuertes por sí solos."}
    ]},
    {q:"Al final del día, ¿en qué se transformó la relación económica real entre Washington y Pekín?",o:[
        {t:"En un torneo de League of Legends transmitido desde la Casa Blanca.",c:0,m:"🎮 ¡FALSO! Los eSports unen, los aranceles separan."},
        {t:"En una 'Guerra Fría tecnológica' enfocada en dividir las cadenas de suministro.",c:1,m:"¡CORRECTO! 🏆 Ahora cada superpotencia busca fabricar todo por su cuenta."},
        {t:"En un intercambio perpetuo de gritos e insultos en la ONU sin subtítulos.",c:0,m:"🤝 ¡WRONG! La diplomacia real pasa por el bloqueo de fábricas y patentes."}
    ]}
];
let id=0,pts=0;
function load(){
    if(id>=qs.length){
        let r=pts>=80?"🥇 Maestro del 'Art of the Deal'":"🥈 Economista Castigado por Aranceles";
        document.getElementById('g-zone').innerHTML=`<div style="text-align:center;padding:10px;"><h2>¡Quiz Terminado!</h2><p style="font-size:1.2rem;">Puntos: <strong style="color:#38bdf8">${pts}</strong></p><div class="fb-box c-box" style="display:block;margin-top:15px;">🏆 Rango:<br><strong>${r}</strong></div><p style="color:#94a3b8;margin-top:20px;font-size:0.85rem;">¡Listo para proyectar y dominar tu presentación del colegio!</p></div>`;
        return;
    }
    let p=qs[id]; document.getElementById('p-txt').innerText=`Pregunta: ${id+1}/${qs.length}`;
    document.getElementById('q-div').innerText=p.q;
    let divO=document.getElementById('opts-div'); divO.innerHTML='';
    document.getElementById('fb-div').style.display='none'; document.getElementById('nxt-b').style.display='none';
    p.o.forEach(o=>{
        let b=document.createElement('button'); b.className='opt-btn'; b.innerText=o.t;
        b.onclick=()=>{
            Array.from(document.getElementsByClassName('opt-btn')).forEach(x=>x.disabled=true);
            let f=document.getElementById('fb-div'); f.innerText=o.m; f.style.display='block';
            if(o.c){ f.className="fb-box c-box"; b.style.background="#16a34a"; pts+=20; document.getElementById('pts-txt').innerText=`Puntos: ${pts}`; }
            else { f.className="fb-box i-box"; b.style.background="#991b1b"; }
            document.getElementById('nxt-b').style.display='block';
        };
        divO.appendChild(b);
    });
}
function nxt(){ id++; load(); } load();
</script></body></html>
